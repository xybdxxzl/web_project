<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的提交 · Mini OJ</title>
    <script>
        (() => {
            let saved;
            try { saved = localStorage.getItem("mini-oj:theme"); } catch {}
            document.documentElement.dataset.theme = saved === "dark" || saved === "light"
                ? saved : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        })();
    </script>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/submissions.js"></script>
</head>
<body>
    <nav id="top-nav" aria-label="顶部导航"></nav>
    <main class="page">
        <h1>我的提交</h1>
        <p id="history-message" role="status"></p>
        <div class="table-wrap" tabindex="0" role="region" aria-label="提交记录列表">
            <table>
                <thead>
                    <tr>
                        <th scope="col">提交编号</th><th scope="col">题目</th><th scope="col">语言</th>
                        <th scope="col">状态</th><th scope="col">耗时</th><th scope="col">提交时间</th>
                    </tr>
                </thead>
                <tbody id="history-rows"></tbody>
            </table>
        </div>
        <nav id="history-pagination" class="pagination" aria-label="提交记录分页" hidden></nav>
    </main>
    <template id="submission-detail-template">
        <div>
            <p class="detail-message" role="status">正在加载…</p>
            <div class="detail-content" hidden>
                <p><span class="detail-status"></span><span class="detail-time"></span></p>
                <h3>源代码</h3>
                <pre class="detail-code plain-text sample-text" tabindex="0"></pre>
                <section class="detail-error-section" hidden>
                    <h3>错误信息</h3>
                    <pre class="detail-error plain-text sample-text" tabindex="0"></pre>
                </section>
            </div>
        </div>
    </template>
</body>
</html>
